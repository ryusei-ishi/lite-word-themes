    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@glidejs/glide/dist/css/glide.core.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/@glidejs/glide/dist/glide.min.js"></script>



</head>

<body>

    <div class="lw_content_wrap page">
        <div class="main_content">
            <section class="post_content">
                <div class="post_style page">
                    <div class="first_content"></div>
                    <div class="lw-pr-column-1" style="

                            /* custom_wrap */
                            --column-1-wrap-padding-pc:0;
                            --column-1-wrap-padding-sp:0;

                            /* borderのデザインを設定 */
                            --column-1-border-color-pc:rgb(131, 131, 131);
                            --column-1-border-width-pc:0;
                            --column-1-border-style-pc:solid;
                            --column-1-border-color-sp:var(--column-1-border-color-pc);
                            --column-1-border-width-sp:var(--column-1-border-width-pc);
                            --column-1-border-style-sp:var(--column-1-border-style-pc);

                

                            /* カラムの比率とカラム数の設定 */
                            --column-1-gtc-pc: 1fr 1fr 1fr;
                            --column-1-gtc-sp: 1fr 1fr;

                            /* gap */
                            --column-1-row-gap-pc:8px;
                            --column-1-row-gap-sp:var(--column-1-row-gap-pc);
                            --column-1-column-gap-pc:8px;
                            --column-1-column-gap-sp:var(--column-1-column-gap-pc);

                            /* custom_column_itemの背景納屋余白など */
                            --column-1-item-bg:#c0d2e8;
                            --column-1-item-padding-pc:24px;
                            --column-1-item-padding-sp:16px;
                        ">
                        <div class="custom_wrap">
                            <div class="custom_column_item">item</div>
                            <div class="custom_column_item">item</div>
                            <div class="custom_column_item">item</div>
                            <div class="custom_column_item">item</div>
                            <div class="custom_column_item">item</div>
                            <div class="custom_column_item">item</div>
                            <div class="custom_column_item">item</div>
                            <div class="custom_column_item">item</div>

                        </div>
                    </div>



                    <div class="last_content"></div>
                </div>
            </section>
        </div>
    </div>



</body>

</html>
